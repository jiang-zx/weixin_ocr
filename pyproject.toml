[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weixin-ocr"
version = "0.1.0"
description = "微信聊天截图 OCR 解析工具 (支持 MCP 和本地运行)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.21.0",
    "opencv-python>=4.5.0",
    "paddlepaddle>=2.4.0",
    "paddleocr>=2.6.0",
    "mcp>=1.0.0",
    "uvicorn>=0.20.0",
    "starlette>=0.20.0",
    "requests>=2.20.0"
]

[project.scripts]
weixin-ocr = "weixin_ocr.cli:main"
weixin-ocr-server = "weixin_ocr.server:main"

[tool.setuptools.packages.find]
where = ["src"]
